# HH-DB-01 Stage 2 WP-2B - the PostgreSQL deployment surface.
#
# NOT DEPLOYED. This file is a deployment surface, not a cutover: no cluster is initialized,
# no role is created, no credential is populated and the SQLite stack in deploy/compose.yaml
# remains the running deployment. WP-2B does not authorize a Production cutover.
#
# Deliberate properties (HH-DB-01 Architecture Frozen Specification v1.0):
#   * a dedicated, digest-pinned PostgreSQL 16 container named house-helper-db, with its own
#     PGDATA volume and NO published port (GOV-03, ARC-02, PRD-05);
#   * one internal-only database network. The web application is the only service that joins
#     both this network and Traefik's proxy network; no one-shot joins the proxy network and
#     no service publishes a port (ARC-02);
#   * one DSN literal per service, carrying no password. The DSN has exactly one source: this
#     file. The application env file must not contain HOUSE_HELPER_DATABASE_URL (ARC-03, ST-02);
#   * one libpq passfile per login, mounted read-only at
#     /run/credentials/<role>.pgpass and selected by PGPASSFILE (OD-8 as approved for this
#     work package). The host files are mode 0600, owned by the container's running user, and
#     are never committed. No real credential is generated by this repository;
#   * explicit pg_hba.conf ordering: the bootstrap superuser is local/peer only and remote
#     superuser TCP access is explicitly rejected before the generic scram-sha-256 line
#     (AUTH-01, section 2 of the WP-2B brief);
#   * an ACCIDENTAL-ACTIVATION GUARD in two layers. Every service is behind a Compose profile
#     and the file requires HOUSE_HELPER_PG_ACTIVATE through a required interpolation, so an
#     ordinary `docker compose -f deploy/compose.postgres.yaml up` fails before any service is
#     selected. That interpolation rejects only an unset or empty value: it also accepts `0`
#     or `false`. A Compose profile is only a selection aid, and naming a service explicitly
#     activates its profile. Therefore the database and web containers also run a runtime
#     guard as their entrypoint, and every one-shot checks the value before it validates its
#     wiring: those start only when HOUSE_HELPER_PG_ACTIVATE is exactly `1`, whatever selected
#     the service. A separate project name alone does not prevent competing Traefik router
#     labels.
#
# The five one-shot services (migrate, provision, purge, backup, restore) are boundaries, not
# implementations. Each has only its own login, its own passfile and the database network.
# Their entrypoint refuses every execution until WP-2C packages the executor; this is
# deliberate, because a migration path that runs `alembic upgrade head` without the mandatory
# post-migration re-application of db/privileges.sql would be worse than no path at all.
# PostgreSQL backup/restore are WP-2D; production enrollment is WP-2C/WP-2E. See
# deploy/postgres/README.md.
#
# Variables read by Compose itself:
#   HOUSE_HELPER_PG_ACTIVATE          REQUIRED. Set it to exactly 1 only for a deliberate
#                                     activation. Missing or empty fails to parse; any other
#                                     value (including 0 and false) is refused by the runtime
#                                     guard before the container starts its work.
#   HOUSE_HELPER_PG_CREDENTIALS_DIR   host directory holding the per-role passfiles
#                                     (default ./postgres/credentials, relative to this file)
#   HOUSE_HELPER_ENV_FILE             the application's non-database environment file
#                                     (default ./house-helper.env)
#   HOUSE_HELPER_IMAGE_TAG            the application image tag (default "local")
#   HOUSE_HELPER_HOST                 the public host name (default house.elivcloud.org)
#   HOUSE_HELPER_HSTS_SECONDS         HSTS max-age (default 86400)
#   HOUSE_HELPER_GIT_SHA              recorded in the image's revision label

name: house-helper-pg

x-hardening: &hardening
  # The application and its one-shots keep the SQLite deployment's hardening. The PostgreSQL
  # image is deliberately NOT given read_only/cap_drop: its entrypoint must chown PGDATA and
  # drop privileges. That deviation is documented, not accidental.
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700

x-app-image: &app-image
  image: house-helper:${HOUSE_HELPER_IMAGE_TAG:-local}
  # Never fetch an image of this name from a registry: it is built from this checkout.
  pull_policy: never

x-app-labels: &app-labels
  # The PostgreSQL web service carries the same Traefik routers as the SQLite one, on purpose:
  # after a deliberate cutover the public host name and the routing shape must not change. The
  # duplicate router labels are exactly why the activation guard above exists.
  traefik.enable: "true"
  traefik.docker.network: "n8n_n8n_network"
  traefik.http.services.house-helper.loadbalancer.server.port: "8000"
  traefik.http.middlewares.house-helper-headers.headers.stsSeconds: "${HOUSE_HELPER_HSTS_SECONDS:-86400}"
  traefik.http.middlewares.house-helper-headers.headers.contentTypeNosniff: "true"
  traefik.http.middlewares.house-helper-headers.headers.frameDeny: "true"
  traefik.http.middlewares.house-helper-limit-signin.ratelimit.average: "10"
  traefik.http.middlewares.house-helper-limit-signin.ratelimit.period: "1m"
  traefik.http.middlewares.house-helper-limit-signin.ratelimit.burst: "5"
  traefik.http.middlewares.house-helper-limit-auth.ratelimit.average: "60"
  traefik.http.middlewares.house-helper-limit-auth.ratelimit.period: "1m"
  traefik.http.middlewares.house-helper-limit-auth.ratelimit.burst: "30"
  traefik.http.middlewares.house-helper-limit-api.ratelimit.average: "60"
  traefik.http.middlewares.house-helper-limit-api.ratelimit.period: "1m"
  traefik.http.middlewares.house-helper-limit-api.ratelimit.burst: "30"
  traefik.http.routers.house-helper-signin.rule: "Host(`${HOUSE_HELPER_HOST:-house.elivcloud.org}`) && (Path(`/auth/telegram/login`) || Path(`/auth/invite/start`) || PathPrefix(`/auth/email/`))"
  traefik.http.routers.house-helper-signin.priority: "30"
  traefik.http.routers.house-helper-signin.entrypoints: "websecure"
  traefik.http.routers.house-helper-signin.tls: "true"
  traefik.http.routers.house-helper-signin.tls.certresolver: "letsencrypt"
  traefik.http.routers.house-helper-signin.service: "house-helper"
  traefik.http.routers.house-helper-signin.middlewares: "house-helper-headers,house-helper-limit-signin"
  traefik.http.routers.house-helper-auth.rule: "Host(`${HOUSE_HELPER_HOST:-house.elivcloud.org}`) && PathPrefix(`/auth/`)"
  traefik.http.routers.house-helper-auth.priority: "20"
  traefik.http.routers.house-helper-auth.entrypoints: "websecure"
  traefik.http.routers.house-helper-auth.tls: "true"
  traefik.http.routers.house-helper-auth.tls.certresolver: "letsencrypt"
  traefik.http.routers.house-helper-auth.service: "house-helper"
  traefik.http.routers.house-helper-auth.middlewares: "house-helper-headers,house-helper-limit-auth"
  traefik.http.routers.house-helper-api.rule: "Host(`${HOUSE_HELPER_HOST:-house.elivcloud.org}`) && PathPrefix(`/api/`)"
  traefik.http.routers.house-helper-api.priority: "20"
  traefik.http.routers.house-helper-api.entrypoints: "websecure"
  traefik.http.routers.house-helper-api.tls: "true"
  traefik.http.routers.house-helper-api.tls.certresolver: "letsencrypt"
  traefik.http.routers.house-helper-api.service: "house-helper"
  traefik.http.routers.house-helper-api.middlewares: "house-helper-headers,house-helper-limit-api"
  traefik.http.routers.house-helper.rule: "Host(`${HOUSE_HELPER_HOST:-house.elivcloud.org}`)"
  traefik.http.routers.house-helper.priority: "10"
  traefik.http.routers.house-helper.entrypoints: "websecure"
  traefik.http.routers.house-helper.tls: "true"
  traefik.http.routers.house-helper.tls.certresolver: "letsencrypt"
  traefik.http.routers.house-helper.service: "house-helper"
  traefik.http.routers.house-helper.middlewares: "house-helper-headers"

services:
  # The dedicated PostgreSQL 16 cluster. It is not reachable through the proxy network and
  # publishes no port: the only way in is by container name on house-helper-db.
  house-helper-db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: house-helper-db
    profiles: ["pg"]
    restart: unless-stopped
    init: true
    # The runtime activation guard. Compose interpolates and profiles only select; this
    # entrypoint is what actually starts the image, so it runs even when the service was named
    # explicitly. It refuses anything but the exact value `1`, then replaces itself with the
    # image's own entrypoint and the command below, preserving the accepted first-init
    # behaviour. A new mount or a replacement entrypoint is refused by the preflight's exact
    # allowlist.
    entrypoint:
      - /bin/sh
      - -c
      - 'test "$$HOUSE_HELPER_PG_ACTIVATE" = 1 || { echo "refused [pg_activation]: HOUSE_HELPER_PG_ACTIVATE must be exactly 1; nothing was started." >&2; exit 78; }; exec /usr/local/bin/docker-entrypoint.sh "$$@"'
      - house-helper-pg-activate
    command: ["postgres", "-c", "config_file=/etc/house-helper/postgresql.conf"]
    environment:
      # The host's value is passed through unchanged so the runtime guard above can compare it.
      # It is not defaulted: a missing or empty value already fails Compose interpolation.
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      # The official image needs a bootstrap superuser password on first init. It is read from
      # a root-only file, never from the environment and never from a `trust` setting. The
      # custom pg_hba.conf makes the verifier unusable remotely; its later lifecycle belongs
      # to WP-2C (Mode A enrollment).
      #
      # POSTGRES_USER and POSTGRES_DB are deliberately NOT set: the image's defaults create
      # exactly the `postgres` superuser and the `postgres` database, which is the fresh-cluster
      # inventory Mode A requires. Setting them to anything else would create extra objects
      # before enrollment.
      POSTGRES_PASSWORD_FILE: /run/credentials/postgres_superuser.password
    labels:
      # The selection-time layer of the activation guard. Compose interpolates the whole file
      # before it selects a service, so this required variable stops `up`, `run`, `config` and
      # every other ordinary invocation when the variable is missing or empty. It is not an
      # equality check (`0` and `false` pass it); the entrypoint above is the layer that
      # requires exactly `1`.
      house-helper.pg.activation: "${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}"
      house-helper.pg.component: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ./postgres/postgresql.conf
        target: /etc/house-helper/postgresql.conf
        read_only: true
      - type: bind
        source: ./postgres/pg_hba.conf
        target: /etc/house-helper/pg_hba.conf
        read_only: true
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/postgres_superuser.password
        target: /run/credentials/postgres_superuser.password
        read_only: true
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # The web application. Same image, same Traefik routers, same non-database environment file
  # as the SQLite deployment; a PostgreSQL DSN literal, the /state volume and exactly one
  # passfile are the differences. It does not mount the SQLite data volume (ARC-01).
  house-helper:
    <<: [*app-image, *hardening]
    # The same build as deploy/compose.yaml, so this surface does not depend on an image
    # another file happened to leave behind. Nothing builds it in WP-2B.
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${HOUSE_HELPER_GIT_SHA:-unknown}
    profiles: ["pg"]
    restart: unless-stopped
    init: true
    # The same runtime activation guard as the database. It is the web service's entrypoint, so
    # it runs however the service was selected. Compose ignores an image's default CMD whenever
    # a non-null entrypoint is declared, so the WP-2A dbtool start gate is repeated verbatim
    # below: the guard receives it as "$@" and replaces itself with it only when the activation
    # value is exactly `1`. The preflight accepts only this exact command.
    entrypoint:
      - /bin/sh
      - -c
      - 'test "$$HOUSE_HELPER_PG_ACTIVATE" = 1 || { echo "refused [pg_activation]: HOUSE_HELPER_PG_ACTIVATE must be exactly 1; nothing was started." >&2; exit 78; }; exec "$$@"'
      - house-helper-pg-activate
    command:
      - python
      - /opt/house-helper/ops/dbtool.py
      - serve
      - --
      - uvicorn
      - house_helper.web.asgi:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --no-server-header
      - --log-config
      - /opt/house-helper/logging.json
      - --lifespan
      - "on"
      - --timeout-keep-alive
      - "120"
      - --timeout-graceful-shutdown
      - "30"
    env_file: ${HOUSE_HELPER_ENV_FILE:-house-helper.env}
    environment:
      # The host's value, unchanged, for the runtime guard. An application env file cannot
      # weaken it: this explicit environment entry takes precedence over env_file.
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      # One DSN, from this file only, with no password in it. The password comes from the
      # passfile named by PGPASSFILE (libpq/psycopg read it; no application code changes).
      HOUSE_HELPER_DATABASE_URL: postgresql+psycopg://hh_app@house-helper-db:5432/house_helper
      HOUSE_HELPER_PUBLIC_URL: https://${HOUSE_HELPER_HOST:-house.elivcloud.org}
      # WP-2A requires the state volume for the PostgreSQL maintenance lock.
      HOUSE_HELPER_STATE_DIR: /state
      PGPASSFILE: /run/credentials/hh_app.pgpass
    volumes:
      - state:/state
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/hh_app.pgpass
        target: /run/credentials/hh_app.pgpass
        read_only: true
    networks:
      - proxy
      - db
    depends_on:
      house-helper-db:
        condition: service_healthy
    stop_grace_period: 75s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    labels:
      <<: *app-labels

  # --- operational one-shots -----------------------------------------------------------------
  # Each service is a boundary: one login, one passfile, the database network only, no proxy,
  # no published port, no Traefik label and no log driver (an invitation secret is printed on
  # stdout by provisioning). The entrypoint refuses every execution in WP-2B, and refuses
  # anything but HOUSE_HELPER_PG_ACTIVATE=1 before it even validates the wiring.
  migrate:
    <<: [*app-image, *hardening]
    profiles: ["ops"]
    restart: "no"
    init: true
    entrypoint: ["python", "/opt/house-helper/ops/pg_oneshot.py"]
    command: ["migrate"]
    environment:
      # The one-shot checks this before anything else; `0` and `false` pass Compose's required
      # interpolation, so the value must be handed through for the runtime check.
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      HOUSE_HELPER_DATABASE_URL: postgresql+psycopg://hh_migrate@house-helper-db:5432/house_helper
      HOUSE_HELPER_STATE_DIR: /state
      PGHOST: house-helper-db
      PGPORT: "5432"
      PGDATABASE: house_helper
      PGUSER: hh_migrate
      PGAPPNAME: hh_migrate
      PGPASSFILE: /run/credentials/hh_migrate.pgpass
    volumes:
      - state:/state
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/hh_migrate.pgpass
        target: /run/credentials/hh_migrate.pgpass
        read_only: true
    networks:
      - db
    logging:
      driver: none
    healthcheck:
      disable: true

  provision:
    <<: [*app-image, *hardening]
    profiles: ["ops"]
    restart: "no"
    init: true
    entrypoint: ["python", "/opt/house-helper/ops/pg_oneshot.py"]
    command: ["provision"]
    environment:
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      HOUSE_HELPER_DATABASE_URL: postgresql+psycopg://hh_provision@house-helper-db:5432/house_helper
      HOUSE_HELPER_STATE_DIR: /state
      PGHOST: house-helper-db
      PGPORT: "5432"
      PGDATABASE: house_helper
      PGUSER: hh_provision
      PGAPPNAME: hh_provision
      PGPASSFILE: /run/credentials/hh_provision.pgpass
    volumes:
      - state:/state
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/hh_provision.pgpass
        target: /run/credentials/hh_provision.pgpass
        read_only: true
    networks:
      - db
    logging:
      driver: none
    healthcheck:
      disable: true

  purge:
    <<: [*app-image, *hardening]
    profiles: ["ops"]
    restart: "no"
    init: true
    entrypoint: ["python", "/opt/house-helper/ops/pg_oneshot.py"]
    command: ["purge"]
    environment:
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      HOUSE_HELPER_DATABASE_URL: postgresql+psycopg://hh_purge@house-helper-db:5432/house_helper
      HOUSE_HELPER_STATE_DIR: /state
      PGHOST: house-helper-db
      PGPORT: "5432"
      PGDATABASE: house_helper
      PGUSER: hh_purge
      PGAPPNAME: hh_purge
      PGPASSFILE: /run/credentials/hh_purge.pgpass
    volumes:
      - state:/state
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/hh_purge.pgpass
        target: /run/credentials/hh_purge.pgpass
        read_only: true
    networks:
      - db
    logging:
      driver: none
    healthcheck:
      disable: true

  backup:
    <<: [*app-image, *hardening]
    profiles: ["ops"]
    restart: "no"
    init: true
    entrypoint: ["python", "/opt/house-helper/ops/pg_oneshot.py"]
    command: ["backup"]
    environment:
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      HOUSE_HELPER_DATABASE_URL: postgresql+psycopg://hh_backup@house-helper-db:5432/house_helper
      HOUSE_HELPER_STATE_DIR: /state
      PGHOST: house-helper-db
      PGPORT: "5432"
      PGDATABASE: house_helper
      PGUSER: hh_backup
      PGAPPNAME: hh_backup
      PGPASSFILE: /run/credentials/hh_backup.pgpass
    volumes:
      - state:/state
      - type: volume
        target: /staging
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/hh_backup.pgpass
        target: /run/credentials/hh_backup.pgpass
        read_only: true
    networks:
      - db
    logging:
      driver: none
    healthcheck:
      disable: true

  restore:
    <<: [*app-image, *hardening]
    profiles: ["ops"]
    restart: "no"
    init: true
    entrypoint: ["python", "/opt/house-helper/ops/pg_oneshot.py"]
    command: ["restore"]
    environment:
      HOUSE_HELPER_PG_ACTIVATE: ${HOUSE_HELPER_PG_ACTIVATE:?set HOUSE_HELPER_PG_ACTIVATE=1 to operate the PostgreSQL stack}
      # The DSN names the database this role is for. hh_restore never connects to it: the
      # maintenance database for restore control statements is OD-2, still OPEN. PGDATABASE is
      # deliberately absent, and the passfile's database field is `*`. WP-2D parameterizes the
      # OD-2 choice; this file must not pre-decide it.
      HOUSE_HELPER_DATABASE_URL: postgresql+psycopg://hh_restore@house-helper-db:5432/house_helper
      HOUSE_HELPER_STATE_DIR: /state
      PGHOST: house-helper-db
      PGPORT: "5432"
      PGUSER: hh_restore
      PGAPPNAME: hh_restore
      PGPASSFILE: /run/credentials/hh_restore.pgpass
    volumes:
      - state:/state
      - type: volume
        target: /staging
      - type: bind
        source: ${HOUSE_HELPER_PG_CREDENTIALS_DIR:-./postgres/credentials}/hh_restore.pgpass
        target: /run/credentials/hh_restore.pgpass
        read_only: true
    networks:
      - db
    logging:
      driver: none
    healthcheck:
      disable: true

volumes:
  pgdata:
    # A fixed name, so it does not depend on the project's or the directory's name. Dedicated
    # to this cluster: never the SQLite volume and never a host path.
    name: house-helper-pgdata
  state:
    # The maintenance lock volume (LCK-01). The web service and every authorized one-shot mount
    # it at /state; the PostgreSQL container never does. The image creates /state owned by the
    # application's uid, so a new named volume inherits that ownership.
    name: house-helper-pg-state

networks:
  db:
    # Internal only: no route to the internet, no published port, no generic `postgres` or
    # `db` alias. The fixed subnet is the CIDR that pg_hba.conf permits for scram-sha-256.
    # The value is an UNVERIFIED CANDIDATE for this host; deploy/postgres/preflight.py refuses
    # to proceed if it overlaps an existing Docker network.
    name: house-helper-pg-db
    internal: true
    ipam:
      config:
        - subnet: 10.213.79.0/24
  proxy:
    external: true
    name: n8n_n8n_network
