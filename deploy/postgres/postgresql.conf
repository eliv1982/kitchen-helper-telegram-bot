# HH-DB-01 Stage 2 WP-2B - the minimal PostgreSQL server configuration.
#
# The file is bind-mounted read-only at /etc/house-helper/postgresql.conf and selected by the
# container command (`postgres -c config_file=...`). It deliberately contains only what the
# binding architecture requires:
#
#   * listen_addresses = '*' - the container is reachable only by container name on the
#     internal `house-helper-pg-db` network. There is no published port.
#   * password_encryption = scram-sha-256 - ROL-08. The official image's bootstrap ALTER USER
#     runs against this server, so the superuser verifier is scrambled from the first init.
#   * hba_file - the explicit AUTH-01 file, not the stock one written into PGDATA.
#   * unix_socket_directories - the image's socket directory, for `docker exec ... psql`.
#
# Deliberately absent (each remains an open Owner choice):
#   * ssl / hostssl configuration - OD-6 is OPEN. Do not configure TLS prematurely, and do not
#     record a "no TLS" decision here either.
#   * patch cadence and image-bump procedure - OD-7 is OPEN. The image is pinned by digest in
#     the Compose file; this file does not add a patch policy.
#   * tuning (max_connections, shared_buffers, logging, autovacuum, ...) - OD-7 is OPEN. No
#     optional configuration is invented by this work package.
#   * the administrative maintenance database - OD-2 is OPEN. Nothing here selects `postgres`
#     or a dedicated `house_helper_admin`.

listen_addresses = '*'
password_encryption = 'scram-sha-256'
hba_file = '/etc/house-helper/pg_hba.conf'
unix_socket_directories = '/var/run/postgresql'
