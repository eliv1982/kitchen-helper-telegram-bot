# HH-DB-01 Stage 2 WP-2B - PostgreSQL host-based authentication (AUTH-01).
#
# The file is bind-mounted read-only into the PostgreSQL container at
# /etc/house-helper/pg_hba.conf and selected by `hba_file` in postgresql.conf. It is NOT the
# stock pg_hba.conf the image writes into PGDATA.
#
# PostgreSQL evaluates this file in order and uses the FIRST matching line. The order below is
# therefore part of the contract, not a style choice:
#
#   1. the bootstrap superuser may use the local Unix socket, and only as the operating-system
#      user postgres (peer). This is how `docker exec -u postgres ... psql` administers the
#      cluster; a root `docker exec` does not match the peer identity.
#   2. every other local-socket connection is refused. Runtime logins use TCP, where their
#      scram-sha-256 verifier applies.
#   3. a REMOTE superuser connection is explicitly refused. A generic
#      `host all all <CIDR> scram-sha-256` line would otherwise match `postgres` too: this line
#      must come first so that it never does.
#   4. project logins may use scram-sha-256 from the database network's CIDR only. No `trust`
#      line exists anywhere, and no `md5` line exists anywhere.
#   5. anything from any other address is refused explicitly. (PostgreSQL would reject an
#      unmatched connection anyway; the line makes the intent visible.)
#
# OD-6 (TLS on the private database network) remains OPEN. There is deliberately no `hostssl`
# line and no TLS requirement here; the unencrypted internal bridge is residual risk RSK-08,
# not an approved "no TLS" decision.
#
# The CIDR must match the `db` network subnet in deploy/compose.postgres.yaml. Both are static
# because libpq's startup path cannot read a Compose variable from this file;
# deploy/postgres/preflight.py refuses if they disagree or if the candidate subnet overlaps an
# existing Docker network on the host.

# TYPE   DATABASE   USER        ADDRESS           METHOD
local    all        postgres                      peer
local    all        all                           reject
host     all        postgres    10.213.79.0/24    reject
host     all        all         10.213.79.0/24    scram-sha-256
host     all        all         all               reject
