# Configuration for the `alembic` command (revision, upgrade, downgrade, ...).
# The application itself does not read this file: house_helper.persistence.database
# builds the same configuration in code. The database is chosen by the
# HOUSE_HELPER_DATABASE_URL environment variable (default: sqlite:///house_helper.db
# in the working directory); no URL, and no credential, belongs in this file.

[alembic]
script_location = %(here)s/house_helper/persistence/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
