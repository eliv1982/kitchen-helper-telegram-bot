[pytest]
# HH-DB-01 CI-07: the PostgreSQL suites carry this marker. CI sets
# HOUSE_HELPER_TEST_POSTGRES_URL, so they must run there; tests/conftest.py fails
# the run if a PostgreSQL-marked test is skipped while the variable is set. Locally
# the suites stay opt-in (CI-13), and a developer without Docker runs the rest.
markers =
    postgres: requires a real PostgreSQL 16 server named by HOUSE_HELPER_TEST_POSTGRES_URL
    sqlite: SQLite-scoped dialect test (CI-02); CI runs these with the PostgreSQL URL unset
